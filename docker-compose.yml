services:
  db:
    image: postgres:16-alpine
    container_name: labcount-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-conteo_lab}
      POSTGRES_USER: ${DB_USER:-conteo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-conteo_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - labcount_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-conteo_user} -d ${DB_NAME:-conteo_lab}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  labcount_pgdata:
